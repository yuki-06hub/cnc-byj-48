<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Générateur de Code Arduino</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1e1e1e;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: auto;
        }
        h2 {
            color: #4CAF50;
        }
        textarea {
            width: 100%;
            height: 150px;
            background-color: #2d2d2d;
            color: #d4d4d4;
            border: 1px solid #555;
            padding: 10px;
            font-family: 'Courier New', Courier, monospace;
            border-radius: 5px;
            box-sizing: border-box;
            resize: vertical;
        }
        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            margin: 15px 0;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
            width: 100%;
        }
        button:hover {
            background-color: #45a049;
        }
        #output {
            background-color: #2d2d2d;
            color: #d4d4d4;
            padding: 15px;
            border: 1px solid #555;
            border-radius: 5px;
            white-space: pre-wrap;
            font-family: 'Courier New', Courier, monospace;
            overflow-x: auto;
            min-height: 300px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Entrez votre texte à ajouter :</h2>
        <textarea id="inputText" placeholder="Tapez votre texte ici..."></textarea>
        
        <button onclick="genererCode()">Générer le code complet</button>

        <h2>Résultat :</h2>
        <div id="output"></div>
    </div>

    <script>
        // Le code de base (sans le void loop final qui est géré par la fonction)
        const codeArduinoBase = `#include <Servo.h>
#include <Arduino.h>
#include <Wire.h>
#include <SoftwareSerial.h>
#include <Stepper.h>

float x_endstop_value = 0;
float y_endstop_value = 0;
float home = 0;
float xmax = 0;
float ymax = 0;
float ciblex = 0;
float cibley = 0;
float pos_x = 0;
float pos_y = 0;
float step_speed = 10;

Servo servo_22;

// 28BYJ-48
Stepper stepper_1(2048, 30, 34, 32, 36);
Stepper stepper_2(2048, 40, 44, 42, 46);

void _loop() {
}

void _delay(float seconds) {
  long endTime = millis() + seconds * 1000;

  while (millis() < endTime) {
    _loop();
  }
}

// =========================
// FONCTIONS
// =========================

void pendown1() {
  servo_22.write(80);
  _delay(1);
}

void pendown0() {
  servo_22.write(120);
  _delay(1);
}

void goto_() {

  // AXE X
  if (pos_x < ciblex) {

    while (pos_x != ciblex) {

      stepper_1.step(-10);
      pos_x += 10;
    }
  }

  if (pos_x > ciblex) {

    while (pos_x != ciblex) {

      stepper_1.step(10);
      pos_x -= 10;
    }
  }

  // AXE Y
  if (pos_y < cibley) {

    while (pos_y != cibley) {

      stepper_2.step(10);
      pos_y += 10;
    }
  }

  if (pos_y > cibley) {

    while (pos_y != cibley) {

      stepper_2.step(-10);
      pos_y -= 10;
    }
  }
}

// =========================
// SETUP
// =========================

void setup() {

  pinMode(2, OUTPUT);
  pinMode(3, OUTPUT);
  pinMode(4, OUTPUT);

  pinMode(11, OUTPUT);

  pinMode(50, INPUT_PULLUP);
  pinMode(51, INPUT_PULLUP);

  servo_22.attach(22);

  stepper_1.setSpeed(step_speed);
  stepper_2.setSpeed(step_speed);

  pendown0();

  xmax = 1430;
  ymax = 1095;

  y_endstop_value = -10;
  x_endstop_value = 10;

  home = 0;

  // Bip démarrage
  tone(11, 1760, 100);
  delay(100);

  // Décalage initial
  stepper_1.step(-120);
  stepper_2.step(120);

  _delay(1);

  // HOME X
  while (digitalRead(50) == HIGH) {

    stepper_1.step(x_endstop_value);
  }

  home += 0.5;

  _delay(1);

  // HOME Y
  while (digitalRead(51) == HIGH) {

    stepper_2.step(y_endstop_value);
  }

  home += 0.5;

  // Home OK
  if (home >= 1.0) {

    pos_x = 0;
    pos_y = 0;

    tone(11, 1976, 250);
    delay(250);
  }

  _delay(1);
}

// =========================
// LOOP
// =========================`;

        function genererCode() {
            // Récupère le texte entré par l'utilisateur
            let texte = document.getElementById('inputText').value;
            
            // Remplace chaque point-virgule (;) par un point-virgule suivi d'un saut de ligne et de deux espaces d'indentation
            let texteTraite = texte.replace(/;/g, ';\n  ').trim();
            
            // Si le texte contient quelque chose, on applique l'indentation sur la toute première ligne
            if (texteTraite) {
                texteTraite = '  ' + texteTraite;
            }
            
            // Construit proprement le bloc void loop() de type Arduino IDE
            let blocLoop = '\nvoid loop() {\n' + texteTraite + '\n}';
            
            // Assemble le tout
            let resultatFinal = codeArduinoBase + '\n' + blocLoop;
            
            // Affiche le résultat final
            document.getElementById('output').textContent = resultatFinal;
        }
    </script>
</body>
</html>
