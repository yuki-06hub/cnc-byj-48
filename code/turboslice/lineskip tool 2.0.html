<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Générateur de Code Arduino</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1e1e1e;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: auto;
        }
        h2 {
            color: #4CAF50;
        }
        textarea {
            width: 100%;
            height: 150px;
            background-color: #2d2d2d;
            color: #d4d4d4;
            border: 1px solid #555;
            padding: 10px;
            font-family: 'Courier New', Courier, monospace;
            border-radius: 5px;
            box-sizing: border-box;
            resize: vertical;
        }
        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            margin: 15px 0;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
            width: 100%;
        }
        button:hover {
            background-color: #45a049;
        }
        #output {
            background-color: #2d2d2d;
            color: #d4d4d4;
            padding: 15px;
            border: 1px solid #555;
            border-radius: 5px;
            white-space: pre-wrap;
            font-family: 'Courier New', Courier, monospace;
            overflow-x: auto;
            min-height: 300px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Entrez votre texte à ajouter :</h2>
        <textarea id="inputText" placeholder="Tapez votre texte ici..."></textarea>
        
        <button onclick="genererCode()">Générer le code complet</button>

        <h2>Résultat :</h2>
        <div id="output"></div>
    </div>

    <script>
        // Le code de base fourni
        const codeArduinoBase = #include <Servo.h>
#include <Arduino.h>
#include <Wire.h>
#include <SoftwareSerial.h>
#include "Stepper.h"

float x_endstop_value = 0;
float y_endstop_value = 0;
float home = 0;
float xmax = 0;
float ymax = 0;
float ciblex = 0;
float cibley = 0;
float pos_x = 0;
float pos_y = 0;

Servo servo_22;
Stepper stepper_1(2048,30,32,34,36);

Stepper stepper_2(2048,40,42,44,46);

void _delay(float seconds) {
  long endTime = millis() + seconds * 1000;
  while(millis() < endTime) _loop();
}

void setup() {
  servo_22.attach(22);
  stepper_1.setSpeed(10);
  stepper_2.setSpeed(10);
  pinMode(11,OUTPUT);
  pinMode(50,INPUT);
  pinMode(51,INPUT);
  voidpenup1() {
    servo_22.write(80);
    _delay(1);
    }
  voidpenup0() {
    servo_22.write(120);
    _delay(1);
    }
  voidgoto_() {
    if(pos_x < ciblex){
      while(!(pos_x == ciblex)){
        stepper_1.step(-10);
        pos_x += 10;

      }

    }
    if(pos_x > ciblex){
      while(!(pos_x == ciblex)){
        stepper_1.step(10);
        pos_x += -10;

      }

    }
    if(pos_x == ciblex){

    }
    if(pos_y < cibley){
      while(!(pos_y == cibley)){
        stepper_2.step(10);
        pos_y += 10;

      }

    }
    if(pos_y > cibley){
      while(!(pos_y == cibley)){
        stepper_2.step(-10);
        pos_y += -10;

      }

    }
    if(pos_y == ciblex){

    }
    }
  penup0();
  xmax = 1430;
  ymax = 1095;
  y_endstop_value = -10;
  x_endstop_value = 10;
  home = 0;
  tone(11,1760,0.1*1000);
  delay(0.1*1000);
  stepper_1.step(-120);
  stepper_2.step(120);
  _delay(1);
  while(!(digitalRead(50) == 0.000000)){
    stepper_1.step(x_endstop_value);

  }
  home += 0.5;
  _delay(1);
  while(!(digitalRead(51) == 0.000000)){
    stepper_2.step(y_endstop_value);

  }
  home += 0.5;
  if(home < 1.1){
    pos_x = 0;
    pos_y = 0;
    tone(11,1976,0.25*1000);
    delay(0.25*1000);

  }
  _delay(1);

}

void _loop() {
}

void loop() {
  _loop();
}

;

        function genererCode() {
            // Récupère le texte entré par l'utilisateur
            let texte = document.getElementById('inputText').value;
            
            // Remplace chaque point-virgule (;) par un point-virgule suivi d'un saut de ligne (\n)
            let texteTraite = texte.replace(/;/g, ';\n');
            
            // Combine le code de base avec le texte traité
            let resultatFinal = codeArduinoBase + '\n\n' + texteTraite;
            
            // Affiche le résultat dans la div
            document.getElementById('output').textContent = resultatFinal;
        }
    </script>
</body>
</html>
